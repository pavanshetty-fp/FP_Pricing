<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Portal — FleetPanda</title>
    <!-- Light by default, as the Unified View: dark only when picked by hand. -->
    <script>
      try {
        /* The theme before first paint; the Accessibility settings follow
           once the app loads (src/components/theme/a11y.ts). */
        var t = localStorage.getItem("fp-theme-choice");
        if (t === "dark" || t === "wcag-dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
