<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Work — FleetPanda</title>
    <!-- LIGHT BY DEFAULT (Pavan, 2026-10-07): dark only when it was picked by
         hand on the toggle, before first paint to avoid a flash. -->
    <script>
      try {
        if (localStorage.getItem("fp-theme-choice") === "dark")
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main-service.tsx"></script>
  </body>
</html>
